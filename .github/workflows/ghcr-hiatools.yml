name: Publicar imagem no GHCR (hIAtools)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Tag ou commit a construir
        default: v0.7.2-fix405
      tag:
        description: Tag da imagem
        default: 0.7.2-fix405

permissions:
  contents: read
  packages: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ inputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/GFL-Recebiveis/evolution-go
          tags: ghcr.io/gfl-recebiveis/evolution-go:${{ inputs.tag }}
